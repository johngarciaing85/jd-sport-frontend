<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EF7"/>
      <stop offset="50%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="g3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#BFDBFE"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="40%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Diamond shape -->
  <!-- Top facet -->
  <polygon points="32,2 48,20 32,20 16,20" fill="url(#g3)"/>
  <!-- Left facet -->
  <polygon points="16,20 32,20 32,60 4,20" fill="url(#g1)"/>
  <!-- Right facet -->
  <polygon points="48,20 32,20 32,60 60,20" fill="url(#g2)"/>
  <!-- Top left small -->
  <polygon points="32,2 16,20 4,20" fill="#1E3A8A"/>
  <!-- Top right small -->
  <polygon points="32,2 48,20 60,20" fill="#2563EB"/>
  <!-- Shine overlay -->
  <polygon points="32,2 16,20 32,20" fill="url(#shine)" opacity="0.5"/>
  <polygon points="32,2 48,20 32,20" fill="url(#shine)" opacity="0.3"/>
  <!-- Edge highlights -->
  <line x1="32" y1="2" x2="16" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <line x1="32" y1="2" x2="48" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <line x1="32" y1="20" x2="32" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
</svg>
